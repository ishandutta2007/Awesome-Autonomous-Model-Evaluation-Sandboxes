<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter for Nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Ambient dynamic animations (in background) */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.45; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.5; }
      50% { r: 9; opacity: 1; }
    }
    @keyframes dashLine {
      from { stroke-dashoffset: 60; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 240px; }
    .orb-3 { animation: pulseOrb 9s ease-in-out infinite 4s; transform-origin: 600px 180px; }

    .pulse-dot-1 { animation: pulseNode 3s ease-in-out infinite; }
    .pulse-dot-2 { animation: pulseNode 3.5s ease-in-out infinite 1s; }
    .pulse-dot-3 { animation: pulseNode 4s ease-in-out infinite 2s; }

    .stream-line {
      stroke-dasharray: 6 8;
      animation: dashLine 4s linear infinite;
    }

    .pill-group {
      animation: floatPill 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Behind Text) -->
  <g id="dynamic-ambient-background">
    <!-- Glowing background blurs -->
    <circle class="orb-1" cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="1000" cy="240" r="150" fill="#818cf8" filter="url(#glow)" />
    <circle class="orb-3" cx="600" cy="180" r="130" fill="#c084fc" filter="url(#glow)" opacity="0.15" />

    <!-- Subtle Tech Grid -->
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#334155" stroke-width="0.5" opacity="0.25" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" stroke="#334155" stroke-width="0.5" opacity="0.25" />

    <!-- Animated Data Flow Lines -->
    <path class="stream-line" d="M 60 290 Q 300 330 600 290 T 1140 290" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
    <path class="stream-line" d="M 60 70 Q 350 30 600 70 T 1140 70" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" style="animation-direction: reverse; animation-duration: 6s;" />

    <!-- Pulsing Circuit / Evaluation Nodes -->
    <circle class="pulse-dot-1" cx="150" cy="70" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle class="pulse-dot-2" cx="1050" cy="70" r="6" fill="#818cf8" filter="url(#glow)" />
    <circle class="pulse-dot-3" cx="600" cy="290" r="6" fill="#c084fc" filter="url(#glow)" />
    <circle class="pulse-dot-1" cx="300" cy="300" r="5" fill="#f472b6" filter="url(#glow)" />
    <circle class="pulse-dot-2" cx="900" cy="290" r="5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g class="pill-group" transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="-118" cy="0" r="4" fill="#38bdf8" />
    <text x="-106" y="4" class="badge-text" fill="#38bdf8">AUTONOMOUS EVALUATION ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always Clear and Readable) -->
  <text x="600" y="132" text-anchor="middle" class="title-text" fill="url(#textGrad)">
    Autonomous Model Evaluation Sandboxes
  </text>

  <text x="600" y="176" text-anchor="middle" class="subtitle-text" fill="url(#subGrad)">
    Multi-Turn Test Cycles  •  Isolated Execution  •  LLM-as-a-Judge  •  Agent Observability
  </text>

  <!-- FOREGROUND FEATURE PILLS -->
  <g transform="translate(190, 218)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85" />
    <text x="90" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🛡️ Agent Sandboxes</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85" />
    <text x="305" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚖️ LLM Judges & Evals</text>

    <!-- Pill 3 -->
    <rect x="430" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85" />
    <text x="525" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔍 OpenTelemetry Tracing</text>

    <!-- Pill 4 -->
    <rect x="650" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.85" />
    <text x="735" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 CI/CD Regressions</text>
  </g>
</svg>
