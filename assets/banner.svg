<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Radial Glow Behind Text -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }

      /* CSS animations for GitHub rendering */
      @keyframes pulseOpacity {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }

      .ambient-glow-1 {
        animation: pulseOpacity 6s ease-in-out infinite;
      }
      .ambient-glow-2 {
        animation: pulseOpacity 8s ease-in-out infinite 2s;
      }
      .flowing-stream {
        stroke-dasharray: 6 8;
        animation: dashFlow 3s linear infinite;
      }
      .floating-badge {
        animation: floatSoft 4s ease-in-out infinite;
      }
      .floating-cards {
        animation: floatSoft 5s ease-in-out infinite 1s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Center Soft Glow -->
  <circle cx="600" cy="160" r="320" fill="url(#centerGlow)" />

  <!-- DYNAMIC AMBIENT BACKGROUND -->
  <g id="ambient-elements">
    <!-- Soft Orbs -->
    <circle class="ambient-glow-1" cx="180" cy="90" r="140" fill="url(#orbGlow1)" />
    <circle class="ambient-glow-2" cx="1020" cy="250" r="150" fill="url(#orbGlow2)" />

    <!-- Subtle Tech Grid -->
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#334155" stroke-width="0.5" opacity="0.22" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" stroke="#334155" stroke-width="0.5" opacity="0.22" />

    <!-- Animated Data Flow Lines -->
    <path class="flowing-stream" d="M 50 300 Q 300 340 600 300 T 1150 300" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45" />
    <path class="flowing-stream" d="M 50 65 Q 350 25 600 65 T 1150 65" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.35" style="animation-direction: reverse; animation-duration: 5s;" />

    <!-- Ambient Circuit Dots -->
    <circle cx="150" cy="65" r="5" fill="#38bdf8" opacity="0.8" />
    <circle cx="1050" cy="65" r="5" fill="#818cf8" opacity="0.8" />
    <circle cx="600" cy="300" r="5" fill="#c084fc" opacity="0.8" />
    <circle cx="300" cy="310" r="4" fill="#f472b6" opacity="0.8" />
    <circle cx="900" cy="300" r="4" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- FOREGROUND: Top Category Tag -->
  <g class="floating-badge" transform="translate(600, 52)">
    <rect x="-145" y="-14" width="290" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="-120" cy="0" r="4" fill="#38bdf8" />
    <text x="-108" y="4" class="badge-text" fill="#38bdf8">AUTONOMOUS EVALUATION ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND: Title & Subtitle -->
  <text x="600" y="132" text-anchor="middle" class="title-text" fill="url(#textGrad)">
    Autonomous Model Evaluation Sandboxes
  </text>

  <text x="600" y="176" text-anchor="middle" class="subtitle-text" fill="url(#subGrad)">
    Multi-Turn Test Cycles  &#8226;  Isolated Execution  &#8226;  LLM-as-a-Judge  &#8226;  Agent Observability
  </text>

  <!-- FOREGROUND: Feature Badges (Always in foreground, non-obscuring) -->
  <g class="floating-cards" transform="translate(190, 222)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="90" y="24" text-anchor="middle" class="pill-text">&#128737;&#65039; Agent Sandboxes</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="305" y="24" text-anchor="middle" class="pill-text">&#9878;&#65039; LLM Judges &amp; Evals</text>

    <!-- Pill 3 -->
    <rect x="430" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="525" y="24" text-anchor="middle" class="pill-text">&#128269; OpenTelemetry Tracing</text>

    <!-- Pill 4 -->
    <rect x="650" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="735" y="24" text-anchor="middle" class="pill-text">&#128640; CI/CD Regressions</text>
  </g>
</svg>
